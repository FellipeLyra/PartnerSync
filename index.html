<!DOCTYPE html>

<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom scrollbar - Light Mode Default */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      /* slate-100 */
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      /* slate-300 */
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
      /* slate-400 */
    }

    /* Dark Mode Overrides */
    .dark ::-webkit-scrollbar-track {
      background: #1e293b;
      /* slate-800 */
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
      /* slate-600 */
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
      /* slate-500 */
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    .animate-scale-in {
      animation: scaleIn 0.3s ease-in-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
